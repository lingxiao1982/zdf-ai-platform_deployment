# Additive nginx snippet for a SHARED host (e.g. zdfai.cn) that already serves
# other apps at / and /SuitAssistant/.
#
# Include this inside an existing `server { ... }` block. Do NOT use root
# nginx.conf / deploy.sh on that host — those are for a dedicated zdfai.site
# box that takes over location /.
#
# Pair with:
#   BASE_PATH=/BestAnswer npm run build          (from zdf-ai-platform/)
#   BASE_PATH=/BestAnswer PORT=<free-port> node backend/server.js
#   pm2 start ecosystem.bestanswer.config.cjs    (set PORT to a free port)
#
# proxy_pass has no URI suffix, so nginx forwards /BestAnswer/... unchanged.
# Express strips BASE_PATH internally.
#
# ^~ is required on a shared host: a sibling `location ~* \.(?:js|css|html)$`
# otherwise wins for hashed /BestAnswer/assets/*.js|css (HTML 200, assets 404,
# blank page). Do not drop ^~. Set proxy_pass to the port this instance uses
# (do not assume production's port).

location = /BestAnswer {
    return 301 /BestAnswer/;
}

location ^~ /BestAnswer/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        'upgrade';
    proxy_read_timeout 120s;
    client_max_body_size 50M;
}
