# OLD snippet shape: prefix location WITHOUT ^~.
# Hashed JS/CSS under /BestAnswer/assets/ then lose to the global regex.

events { worker_connections 64; }
http {
    server {
        listen 127.0.0.1:18081;
        server_name zdfai.cn;

        location = / {
            return 301 /europeBESS-financial/;
        }

        location /europeBESS-financial/ {
            return 200 "bess-ok";
        }

        location /SuitAssistant/ {
            return 200 "suit-ok";
        }

        location ~* \.(?:js|css|html)$ {
            return 404 "global-static-regex";
        }

        location = /BestAnswer {
            return 301 /BestAnswer/;
        }

        location /BestAnswer/ {
            return 200 "bestanswer-ok";
        }
    }
}
