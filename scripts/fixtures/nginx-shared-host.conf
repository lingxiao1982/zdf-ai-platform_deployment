# Isolated shared-host fixture for nginx -t / location-priority tests.
# Mirrors the production shape: BESS at /, SuitAssistant, a GLOBAL static
# regex that 404'd BestAnswer hashed assets, and BestAnswer with ^~.
# Not a copy of production secrets, SSL, or the live proxy port.

events { worker_connections 64; }
http {
    server {
        listen 127.0.0.1:18080;
        server_name zdfai.cn;

        location = / {
            return 301 /europeBESS-financial/;
        }

        location /europeBESS-financial/ {
            return 200 "bess-ok";
        }

        location /SuitAssistant/ {
            return 200 "suit-ok";
        }

        # Global static regex (the interceptor that caused the blank page).
        location ~* \.(?:js|css|html)$ {
            return 404 "global-static-regex";
        }

        location = /BestAnswer {
            return 301 /BestAnswer/;
        }

        # ^~ wins over the regex so /BestAnswer/assets/*.js is not 404'd.
        location ^~ /BestAnswer/ {
            return 200 "bestanswer-ok";
        }
    }
}
